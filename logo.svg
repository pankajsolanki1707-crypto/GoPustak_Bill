<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF7C3F"/>
      <stop offset="100%" stop-color="#C94000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A5C"/>
      <stop offset="100%" stop-color="#E8540A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle inner glow/highlight at top -->
  <rect width="100" height="50" rx="22" fill="rgba(255,255,255,0.06)"/>

  <!-- Document shadow (depth) -->
  <path d="M26 20 H64 L80 36 V84 Q80 90 74 90 H26 Q20 90 20 84 V26 Q20 20 26 20 Z" fill="rgba(0,0,0,0.18)"/>

  <!-- Document body -->
  <path d="M24 18 H62 L78 34 V82 Q78 88 72 88 H24 Q18 88 18 82 V24 Q18 18 24 18 Z" fill="white"/>

  <!-- Folded corner triangle (darker, fold shadow) -->
  <path d="M62 18 L78 34 L62 34 Z" fill="#FFDACC"/>
  <!-- Fold crease highlight -->
  <path d="M62 18 L78 34" stroke="#e8540a" stroke-width="0.8" opacity="0.4"/>

  <!-- Orange brand header bar inside document -->
  <rect x="18" y="18" width="44" height="5" rx="0" fill="url(#accent)" opacity="0"/>

  <!-- Bold orange "brand name" line -->
  <rect x="26" y="26" width="34" height="6" rx="3" fill="url(#accent)"/>

  <!-- Sub-text line -->
  <rect x="26" y="36" width="22" height="3.5" rx="1.75" fill="#e0e0e0"/>

  <!-- Divider line -->
  <rect x="18" y="44" width="60" height="1.5" fill="#f0f0f0"/>

  <!-- Invoice row 1 -->
  <rect x="26" y="51" width="30" height="3.5" rx="1.75" fill="#e0e0e0"/>
  <rect x="62" y="51" width="12" height="3.5" rx="1.75" fill="#e0e0e0"/>

  <!-- Invoice row 2 -->
  <rect x="26" y="60" width="30" height="3.5" rx="1.75" fill="#e0e0e0"/>
  <rect x="62" y="60" width="12" height="3.5" rx="1.75" fill="#e0e0e0"/>

  <!-- Invoice row 3 -->
  <rect x="26" y="69" width="30" height="3.5" rx="1.75" fill="#e0e0e0"/>
  <rect x="62" y="69" width="12" height="3.5" rx="1.75" fill="#e0e0e0"/>

  <!-- Total divider -->
  <rect x="26" y="78" width="48" height="1" rx="0.5" fill="#e5e5e5"/>

  <!-- Total amount highlight (orange pill) -->
  <rect x="52" y="82" width="22" height="6" rx="3" fill="url(#accent)"/>
</svg>
